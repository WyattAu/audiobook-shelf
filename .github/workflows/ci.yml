name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@main
    with:
      tier: a
      all-features: true
      # std-only: the ffmpeg-gated tests run on ubuntu runners, which ship
      # ffmpeg, so the oracle checks execute in CI rather than skipping.
      embedded: false
